

<h2>Image Compressor</h2>

{% if messages %}
  {% for message in messages %}
    <!-- 1. The variable is safely INSIDE the paragraph tags -->
    <p style="color: red;">{{ message }}</p>
  {% endfor %}
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <label for="image_file">Select an Image to compress:</label>
    <br><br>

    <input type="file" name="image_file" id="image_file" accept="image/*" required>
    <br><br>
    
    <!-- 2. The interactive slider for compression quality -->
    <label for="quality">Compression Quality (10 is lowest size, 90 is highest quality):</label>
    <br>
    <input type="range" name="quality" id="quality" min="10" max="90" value="60" oninput="this.nextElementSibling.value = this.value">
    <output>60</output>
    <br><br>
    
    <!-- 3. The correct submit button -->
    <button type="submit">Compress Image</button>

</form>

<br>
<a href="{% url 'dashboard' %}">Back to Dashboard</a>
