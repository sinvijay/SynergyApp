
<h2>Merge PDF Files</h2>

{% if messages %}
  {% for message in messages %}
    <p style="color: red;">{{ message }}</p>
  {% endfor %}
{% endif %}

<!-- The form OPENS here, and includes the enctype attribute -->
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <label for="pdf_files">Select PDFs to Merge:</label>
    <br><br>
    
    <!-- This is the actual file upload box -->
    <input type="file" name="pdf_files" id="pdf_files" accept="application/pdf" multiple required>
    <br><br>
    
    <!-- This is the clickable button -->
    <button type="submit">Merge PDFs</button>
    
<!-- The form CLOSES here, after the button -->
</form>

<br>
<a href="{% url 'dashboard' %}">Back to Dashboard</a>
