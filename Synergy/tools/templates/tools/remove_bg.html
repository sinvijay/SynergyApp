
<h2>Image Background Remover</h2>

{% if messages %}
  {% for message in messages %}
    <p style="color: red;">{{ message }}</p>
  {% endfor %}
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <label for="image_file">Select an Image:</label>
    <br><br>

    <!-- Name MUST be image_file. accept="image/*" allows png, jpg, etc. -->
    <input type="file" name="image_file" id="image_file" accept="image/*" required>
    <br><br>
    
    <!-- Updated the button text -->
    <button type="submit">Remove Background</button>

</form>
    
<br>
<a href="{% url 'dashboard' %}">Back to Dashboard</a>
